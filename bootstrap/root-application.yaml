apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: root-application
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  source:
    repoURL: 'https://github.com/Koretada/startup-idp-argocd.git'
    targetRevision: HEAD
    path: bootstrap/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  project: default